name: Deploy STARK website to immobilienmakler-bergisch-gladbach.de
# NOTFALLWEG. Der regulaere Deploy laeuft im Repo OswaldKasulke/stark
# (.github/workflows/deploy-bgl.yml) automatisch bei jedem Push auf main.
# Diesen hier nur starten, wenn der dortige Lauf klemmt.
# Direct valuation and background lead delivery refreshed 2026-08-22
# Manual deploy trigger 2026-08-25

on:
  push:
    paths:
      - .github/workflows/deploy-stark-bgl.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stark-immobilienmakler-bergisch-gladbach
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout STARK website
        uses: actions/checkout@v4
        with:
          repository: OswaldKasulke/stark
          ref: main
          path: stark-site

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stark-site/package-lock.json

      - name: Install dependencies
        working-directory: stark-site
        run: npm ci

      - name: Build static website
        working-directory: stark-site
        run: npm run build

      - name: Deploy to immobilienmakler-bergisch-gladbach.de
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: w019d9c9.kasserver.com
          username: w019d9c9
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./stark-site/out/
          server-dir: /immobilienmakler-bergisch-gladbach.de/
          dangerous-clean-slate: false
          # Denselben State-Namen wie der regulaere Deploy im Repo stark
          # (.github/workflows/deploy-bgl.yml). Zwei getrennte States fuer
          # dasselbe Serververzeichnis laufen sonst auseinander, und der
          # naechste Lauf scheitert mit 550 auf _next/<build-id>.
          state-name: .ftp-deploy-sync-state-bgl-v2.json
          timeout: 120000

      - name: Verify published pages
        run: |
          curl --fail --silent --show-error --retry 4 --retry-delay 5 "https://immobilienmakler-bergisch-gladbach.de/" > /dev/null
          curl --fail --silent --show-error --retry 4 --retry-delay 5 "https://immobilienmakler-bergisch-gladbach.de/immobilienbewertung/" > /dev/null
          curl --fail --silent --show-error --retry 4 --retry-delay 5 "https://immobilienmakler-bergisch-gladbach.de/impressum/" > /dev/null
          curl --fail --silent --show-error --retry 4 --retry-delay 5 "https://immobilienmakler-bergisch-gladbach.de/agb/" > /dev/null
          curl --fail --silent --show-error --retry 4 --retry-delay 5 "https://immobilienmakler-bergisch-gladbach.de/stadtteile/bensberg/" > /dev/null
