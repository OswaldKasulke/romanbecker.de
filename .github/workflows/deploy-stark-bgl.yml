name: Deploy STARK website to doktorbecker.de/BGL

on:
  push:
    paths:
      - .github/workflows/deploy-stark-bgl.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stark-bgl
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout STARK website
        uses: actions/checkout@v4
        with:
          repository: OswaldKasulke/stark
          ref: main
          path: stark-site

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stark-site/package-lock.json

      - name: Install dependencies
        working-directory: stark-site
        run: npm ci

      - name: Build static website
        working-directory: stark-site
        run: npm run build

      - name: Deploy to doktorbecker.de/BGL
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: w019d9c9.kasserver.com
          username: w019d9c9
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./stark-site/out/
          server-dir: /doktorbecker.de/BGL/
          dangerous-clean-slate: false
