name: Deploy STARK website to doktorbecker.de/BGL
# Direct valuation and background lead delivery refreshed 2026-08-22

on:
  push:
    paths:
      - .github/workflows/deploy-stark-bgl.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-stark-bgl
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout STARK website
        uses: actions/checkout@v4
        with:
          repository: OswaldKasulke/stark
          ref: main
          path: stark-site

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: stark-site/package-lock.json

      - name: Install dependencies
        working-directory: stark-site
        run: npm ci

      - name: Build static website
        working-directory: stark-site
        run: npm run build

      - name: Deploy to doktorbecker.de/BGL
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: w019d9c9.kasserver.com
          username: w019d9c9
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./stark-site/out/
          server-dir: /doktorbecker.de/BGL/
          dangerous-clean-slate: false

      - name: Add lowercase path redirect
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          curl --fail --silent --show-error --ftp-create-dirs \
            --user "w019d9c9:$FTP_PASSWORD" \
            --upload-file stark-site/redirect-bgl/index.html \
            "ftp://w019d9c9.kasserver.com/doktorbecker.de/bgl/index.html"
          curl --fail --silent --show-error --ftp-create-dirs \
            --user "w019d9c9:$FTP_PASSWORD" \
            --upload-file stark-site/redirect-bgl/.htaccess \
            "ftp://w019d9c9.kasserver.com/doktorbecker.de/bgl/.htaccess"

      - name: Verify published pages
        run: |
          curl --fail --silent --show-error --retry 4 --retry-delay 5 "http://doktorbecker.de/BGL/" > /dev/null
          curl --fail --silent --show-error --retry 4 --retry-delay 5 "http://doktorbecker.de/BGL/immobilienbewertung/" > /dev/null
          curl --fail --silent --show-error --retry 4 --retry-delay 5 "http://doktorbecker.de/BGL/stadtteile/bensberg/" > /dev/null
          curl --fail --silent --show-error --location --retry 4 --retry-delay 5 "http://doktorbecker.de/bgl/" > /dev/null
          if ! curl --fail --silent --show-error "https://doktorbecker.de/BGL/" > /dev/null; then
            echo "::warning::HTTPS-Zertifikat für doktorbecker.de ist beim Hoster noch nicht passend konfiguriert."
          fi
