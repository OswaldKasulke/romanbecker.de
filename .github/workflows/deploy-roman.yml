name: Deploy romanbecker.de via FTP

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'roman/**'
  workflow_dispatch:  # Manuell auslösbar (z. B. nach automatisiertem Listings-Commit)
  workflow_run:
    workflows: ["Update Roman Listings"]  # nach täglichem Listings-Update automatisch deployen
    types:
      - completed

# Deploys serialisieren: Push und taegliches Listings-Update duerfen sich
# nicht ueberholen - beide schreiben in dieselbe FTP-Sync-State-Datei.
concurrency:
  group: deploy-roman-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Bei workflow_run nur deployen, wenn das Listings-Update erfolgreich war.
    # (push / workflow_dispatch laufen unverändert.)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHPMailer via Composer
        run: |
          cd roman
          composer install --no-dev --optimize-autoloader

      - name: Write SMTP config
        run: |
          cat > roman/smtp-config.php << 'EOF'
          <?php
          define('SMTP_HOST', 'w019d9c9.kasserver.com');
          define('SMTP_PORT', 587);
          define('SMTP_USER', 'webseite@romanbecker.de');
          define('SMTP_PASS', '${{ secrets.ROMAN_SMTP_PASS }}');
          define('REPORT_SECRET', '${{ secrets.ROMAN_REPORT_SECRET }}');
          EOF

      # Der all-inkl-FTP bricht sporadisch ab (Laeufe #368 und #380). Der erste
      # Versuch darf deshalb scheitern, ohne den Job rot zu faerben; schlaegt er
      # fehl, laeuft ein zweiter. Erst wenn auch der scheitert, ist der Job rot.
      - name: FTP Deploy (Produktion)
        id: ftp_prod
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: w019d9c9.kasserver.com
          username: w019d9c9
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: roman/
          exclude: |
            **/leads.log
            scripts/**
            data/**
          server-dir: /romanbecker.de/root/
          protocol: ftp
          port: 21
          timeout: 120000

      - name: FTP Deploy (Produktion) – zweiter Versuch
        if: github.ref == 'refs/heads/main' && steps.ftp_prod.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: w019d9c9.kasserver.com
          username: w019d9c9
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: roman/
          exclude: |
            **/leads.log
            scripts/**
            data/**
          server-dir: /romanbecker.de/root/
          protocol: ftp
          port: 21
          timeout: 120000

      # Canary: nach dem Upload nachsehen, ob der Server wirklich den Repo-Stand
      # ausliefert. Anlass ist der 02.09.2026 — vier fremde FTP-Vollsyncs haben
      # romanbecker.de auf den Stand von Mitte Juni zurueckgesetzt. Die
      # Deploy-Action merkt so etwas nie: sie vergleicht nur gegen ihre eigene
      # .ftp-deploy-sync-state.json und haelt den Server fuer aktuell. Die Seite
      # stand zwei Tage mit schwarzem Header da, alle Laeufe gruen.
      # Die beiden Stylesheets reichen als Waechter — sie haengen an jeder Seite
      # und aendern sich selten, also praktisch keine Fehlalarme.
      - name: Canary – liefert der Server den Repo-Stand aus?
        if: github.ref == 'refs/heads/main'
        run: |
          fail=0
          for f in stadtteile/shared.css bodenrichtwert.css; do
            want=$(sha256sum "roman/$f" | cut -d' ' -f1)
            got=""
            for try in 1 2 3; do
              got=$(curl -fsS --max-time 30 "https://romanbecker.de/$f?canary=${GITHUB_RUN_ID}.$try" | sha256sum | cut -d' ' -f1)
              if [ "$got" = "$want" ]; then break; fi
              echo "Versuch $try fuer $f noch abweichend – warte 10 s"
              sleep 10
            done
            if [ "$got" = "$want" ]; then
              echo "OK   $f"
            else
              echo "::error::$f weicht ab – Repo $want, live $got. Der Server liefert nicht aus, was im Repo steht."
              fail=1
            fi
          done
          if [ "$fail" = 1 ]; then
            echo "Naechster Schritt: .ftp-deploy-sync-state.json auf dem Server umbenennen oder loeschen und den Workflow neu starten – das erzwingt einen Vollsync (dauert ~7 Minuten statt ~20 Sekunden)."
            exit 1
          fi

      - name: IndexNow – geänderte Seiten an Bing/Yandex melden
        if: github.ref == 'refs/heads/main'
        run: |
          KEY="ad31390dcfcf4fdc03dea50343c9f4f2"
          # Neue + geänderte HTML-Seiten aus diesem Push (leer bei workflow_dispatch)
          FILES=$(jq -r '[.commits[]?.added[]?, .commits[]?.modified[]?] | unique[]' "$GITHUB_EVENT_PATH" 2>/dev/null | grep -E '^roman/.*\.html$' || true)
          if [ -z "$FILES" ]; then
            echo "Keine geänderten HTML-Seiten in diesem Push – IndexNow übersprungen."
            exit 0
          fi
          URLS=$(echo "$FILES" | sed 's#^roman/#https://romanbecker.de/#')
          echo "Melde an IndexNow:"; echo "$URLS"
          URLJSON=$(echo "$URLS" | jq -R . | jq -s .)
          BODY=$(jq -n --arg host "romanbecker.de" --arg key "$KEY" \
            --arg loc "https://romanbecker.de/$KEY.txt" --argjson urls "$URLJSON" \
            '{host:$host, key:$key, keyLocation:$loc, urlList:$urls}')
          code=$(curl -s -o /tmp/indexnow.out -w '%{http_code}' -X POST \
            "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" --data "$BODY")
          echo "IndexNow-Antwort: HTTP $code"
          cat /tmp/indexnow.out 2>/dev/null || true
          # Nicht-2xx soll den Deploy nicht rot färben
          case "$code" in 2*) echo "OK";; *) echo "::warning::IndexNow lieferte HTTP $code";; esac

      - name: FTP Deploy (Preview)
        if: github.ref == 'refs/heads/develop'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: w019d9c9.kasserver.com
          username: w019d9c9
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: roman/
          exclude: |
            **/leads.log
            scripts/**
            data/**
          server-dir: /preview/roman/
          protocol: ftp
          port: 21
