name: Update Bauzinsen

# Wöchentlich: liest die Zinstabellen von ING (PDF), 1822direkt und Interhyp,
# bildet den Mittelwert und schreibt ihn in roman/ratgeber/bauzinsen.html.
# Ist eine Quelle nicht lesbar, bricht das Skript ab und die Seite bleibt
# unverändert (Lauf wird rot). Deploy danach über workflow_run in deploy-roman.yml.

on:
  schedule:
    - cron: '0 6 * * 1'   # montags 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: pdftotext installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Bauzinsen aktualisieren
        run: python3 roman/scripts/update-bauzinsen.py

      - name: Commit and push
        run: |
          if git diff --quiet roman/ratgeber/bauzinsen.html; then
            echo "Keine Änderung."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add roman/ratgeber/bauzinsen.html
          git commit -m "chore(roman): Bauzinsen-Tabelle aktualisiert [automated]"
          git push
