name: Update Roman Listings

on:
  # Zeitplan am 19.10.2026 abgeschaltet: Angebote auf Wunsch von Evernest
  # (Hannes) von der Seite entfernt. Nicht wieder einschalten, sonst kehren
  # die Karten zurueck.
  workflow_dispatch:       # Manuell auslösbar

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # volle History: generate-sitemap.py liest lastmod aus git log

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run scraper
        run: node roman/scripts/update-listings.mjs

      - name: Update Stadtteil/Umland listings
        run: node roman/scripts/update-stadtteil-listings.mjs

      # Objektfotos (images.ctfassets.net) und Karten auf den eigenen Server holen,
      # damit beim Seitenaufruf keine IP an Dritte geht. DSGVO-Prüfung 17.10.2026.
      - name: Fremdinhalte lokal ablegen
        run: |
          python3 -m pip install --quiet Pillow
          python3 roman/scripts/fremdinhalte_lokal.py

      - name: Regenerate sitemap
        run: python3 roman/scripts/generate-sitemap.py

      - name: Check for changes
        id: changes
        run: |
          if git add -N roman/img/ && git diff --quiet roman/index.html roman/en/index.html roman/bautraeger.html roman/stadtteile/ roman/immobilienmakler-rhein-erft/ roman/img/ roman/sitemap.xml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected!"
          fi

      - name: Commit and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add roman/index.html roman/en/index.html roman/bautraeger.html roman/stadtteile/ roman/immobilienmakler-rhein-erft/ roman/img/ roman/sitemap.xml
          git commit -m "chore(roman): update Evernest listings + Standorte + Sitemap [automated]"
          git push
