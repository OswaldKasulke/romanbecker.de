# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

# STILLGELEGT am 22.08.2026 — laeuft nur noch von Hand.
# Zwei Gruende:
#  1. Der Lauf scheiterte bei JEDEM Push, weil fuer dieses Repository kein
#     GitHub Pages eingerichtet ist ("Get Pages site failed"). Allein am
#     22.08.2026 sind so 10 Fehlermails entstanden, in denen ein echter
#     Deploy-Fehler untergegangen waere.
#  2. Der Schritt "Upload artifact" nimmt path: '.', also das komplette
#     Repository. Sobald jemand Pages aktiviert, steht die ganze Website ein
#     zweites Mal unter github.io - eine indexierbare Kopie von
#     romanbecker.de. Fuer die Rankings waere das ein Eigentor.
# Wer das Deployment wirklich will: Pages im Repository einschalten, path auf
# das gewuenschte Verzeichnis eingrenzen, dann den push-Trigger wieder aktivieren.
on:
  # Nur manuell aus dem Actions-Tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
